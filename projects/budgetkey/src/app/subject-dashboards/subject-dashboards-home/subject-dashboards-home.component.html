<app-container [showHeader]="true" [showSearchBar]="true">
    <div class="main" role="main">
        <header class="intro">
            <h1>לוחות מחוונים לפי נושא</h1>
            <p class="subtitle">ניתוחים ותובנות המתעדכנים באופן שוטף, מאורגנים לפי נושא.</p>
        </header>
        <ng-container *ngTemplateOutlet="nodeList; context: { nodes: tree, depth: 0 }"></ng-container>

        <ng-template #nodeList let-nodes="nodes" let-depth="depth">
            <ul class="dashboard-tree" [class.top-level]="depth === 0">
                <li *ngFor="let node of nodes">
                    <ng-container *ngIf="node.isLeaf; else folder">
                        <a class="leaf-link" [routerLink]="['/subject-dashboards'].concat(node.slugSegments)">
                            <span class="leaf-title">{{ node.name }}</span>
                            <span class="leaf-updated" *ngIf="node.updated">עודכן {{ node.updated }}</span>
                        </a>
                    </ng-container>
                    <ng-template #folder>
                        <span class="folder-label">{{ node.name }}</span>
                        <ng-container *ngTemplateOutlet="nodeList; context: { nodes: node.children, depth: depth + 1 }"></ng-container>
                    </ng-template>
                </li>
            </ul>
        </ng-template>
    </div>
</app-container>
